services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartsmart}
      POSTGRES_USER: ${POSTGRES_USER:-cartsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartsmart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cartsmart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartsmart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cartsmart-postgres-data:
